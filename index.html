<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forever Paladin Sims</title>
<link rel="stylesheet" href="site.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; color: var(--gold); }
  .sub { color: var(--muted); margin: 0 0 24px; max-width: 680px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  .sim-card {
    display: flex; flex-direction: column; gap: 6px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    padding: 18px; color: var(--text); text-decoration: none; transition: border-color .15s;
  }
  .sim-card:hover, .sim-card:focus-visible { border-color: var(--gold); }
  .sim-card h2 { font-size: 1.05rem; margin: 0; }
  .sim-card p { color: var(--muted); margin: 0; font-size: 0.9rem; flex: 1; }
  .sim-card .go { color: var(--gold); font-size: 0.85rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1>Forever Paladin Sims</h1>
  <p class="sub">Mana regeneration calculators for WoW Forever paladin talents. Pick a simulator below or from the sidebar.</p>
  <div class="cards" id="sim-list"></div>
</main>
<script src="nav.js"></script>
</body>
</html>
